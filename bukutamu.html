<main>
<section class="konten">
    <h2>Buku Tamu Teras Semeru</h2>

    <p>Silakan isi buku tamu di bawah ini.</p>

    <form id="formTamu">
        <label>Nama Lengkap</label>
        <input type="text" id="namaTamu" placeholder="Nama lengkap" required>

        <label>Asal Daerah</label>
        <input type="text" id="asalTamu" placeholder="Asal daerah" required>

        <label>Tanggal Kunjungan</label>
        <input type="date" id="tanggalTamu" required>

        <label>Pesan dan Kesan</label>
        <textarea id="pesanTamu" rows="4"
        placeholder="Tulis pesan dan kesan" required></textarea>

        <button type="submit">Kirim Buku Tamu</button>
    </form>

    <h3>Daftar Pengunjung</h3>
    <div id="daftarTamu"></div>
</section>
</main>
